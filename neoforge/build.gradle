import net.fabricmc.loom.build.nesting.NestableJarGenerationTask

plugins {
    id 'org.relativitymc.neo-loom'
    //id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'de.maxhenkel.cursegradle' version '1.5.2'
    id 'com.gradleup.shadow'
}

def tv = rootProject.ext.tv
def targetMinecraft = tv('minecraft_version', minecraft_version)
def targetModVersion = tv('mod_version', mod_version)
def isLite = rootProject.ext.isLite

// The lite edition is a separate build of the same version, so it carries its own suffix.
version = "${targetMinecraft}-${targetModVersion}${isLite ? '-lite' : ''}" as String

configurations {
    shadow
}

loom {
    runs {
        serverData {
            environment("serverData")
        }
        clientData {
            environment("clientData")
        }
    }
    accessWidenerPath = project(":common").file("src/main/resources/modernui.classtweaker")
    runConfigs.each { it.setIdeConfigGenerated(true) } // Uncomment this if run configs not generated
}

rootProject.ext.applyTargetSources(project, 'neoforge')

tasks.withType(org.gradle.api.tasks.bundling.Jar).configureEach {
    dependsOn project(":common").tasks.named('mergeTargetJava')
    dependsOn project(":common").tasks.named('mergeTargetResources')
}

tasks.withType(Javadoc).configureEach {
    dependsOn project(":common").tasks.named('mergeTargetJava')
}

tasks.withType(ProcessResources).configureEach {
    dependsOn project(":common").tasks.named('mergeTargetResources')
}

repositories {
    maven {
        url 'https://maven.neoforged.net/releases/'
    }
    maven {
        url 'https://maven.parchmentmc.org/'
        content {
            includeGroup 'org.parchmentmc.data'
        }
    }
    maven { url 'https://modmaven.dev/' }
    maven {
        url 'https://maven.izzel.io/releases/'
    }
    maven {
        url 'https://maven.isxander.dev/releases'
        content {
            includeGroup 'dev.isxander'
        }
    }
    mavenLocal()
    flatDir {
        dir "${rootProject.projectDir}/libs"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    forgeUserdev "net.neoforged:neoforge:${tv('neoforge_version', neoforge_version)}:userdev"

    implementation project(':common')

    ["dev.icyllis:arc3d-compiler"].each {
        implementation(it + ":${arc3d_version}")
        include(it + ":${arc3d_version}")
    }
    ["dev.icyllis:arc3d-core",
     "dev.icyllis:arc3d-sketch",
     "dev.icyllis:arc3d-engine",
     "dev.icyllis:arc3d-granite",
     "dev.icyllis:arc3d-opengl",
     "dev.icyllis:arc3d-vulkan"].each {
        implementation(it + ":${arc3d_version}")
        shadow(it + ":${arc3d_version}") {
            transitive = false
        }
    }
    implementation("dev.icyllis:modernui-core:${core_version}")
    shadow("dev.icyllis:modernui-core:${core_version}") {
        transitive = false
    }
    implementation("icyllis.modernui:ModernUI-Markflow:3.12.0") {
        exclude group: 'icyllis.modernui'
    }
    shadow("icyllis.modernui:ModernUI-Markflow:3.12.0") {
        transitive = false
    }

    compileOnly("org.lwjgl:lwjgl-vulkan:3.4.1")
    testCompileOnly("org.lwjgl:lwjgl-vulkan:3.4.1")

    // Optional VulkanMod integration: compile-only, never bundled or required at runtime.
    compileOnly("maven.modrinth:JYQhtZtO:PNODQNIn")
    testCompileOnly("maven.modrinth:JYQhtZtO:PNODQNIn")

    //implementation(forgeDependencies("com.vladsch.flexmark:flexmark:${flexmark_version}"))

    //modRuntimeOnly("mekanism:Mekanism:1.21.1-10.7.7.64")

    /*include "com.vladsch.flexmark:flexmark:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-ast:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-builder:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-collection:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-data:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-dependency:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-format:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-html:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-misc:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-sequence:${flexmark_version}"
    include "com.vladsch.flexmark:flexmark-util-visitor:${flexmark_version}"*/
    include "org.commonmark:commonmark:${commonmark_version}"

    // Lite ships no font pack at all and renders settings with YetAnotherConfigLib,
    // which the player installs; it is compiled against the official-mapped artifact.
    if (isLite) {
        compileOnly("dev.isxander:yet-another-config-lib:${tv('yacl_version', '3.9.7+26.3-neoforge')}") { transitive = false }
        testCompileOnly("dev.isxander:yet-another-config-lib:${tv('yacl_version', '3.9.7+26.3-neoforge')}") { transitive = false }
    } else {
        shadow ':ModernUI-Fonts-5.0'
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":common").sourceSets.main.allSource
}

tasks.withType(ProcessResources).configureEach {
    // The merged tree arrives both as a project resource and as an explicit copy, so the
    // first copy wins instead of failing on the duplicate.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":common").sourceSets.main.resources
}

test {
    failOnNoDiscoveredTests = false
}

loom.nestJars(
        tasks.named("shadowJar", Jar),
        objects.fileCollection().from(
                tasks.named("processIncludeJars", NestableJarGenerationTask).map {
                    objects.fileTree().from(it.outputDirectory)
                }
        )
)

shadowJar {
    archiveClassifier.set("universal")
    configurations = [project.configurations.shadow]
    // MC 26.2 compile-time stubs must not ship in the mod jar:
    // these packages are exported by the minecraft module itself, and
    // shipping them causes JPMS split-package ResolutionException at startup.
    exclude 'net/minecraft/**'
    exclude 'com/mojang/**'

    /*dependencies {
        exclude 'icu4j-59.1.jar'
        exclude 'commons-logging-1.2.jar'
    }

    relocate 'com.google.errorprone.annotations', 'icyllis.annotations'
    relocate 'org.checkerframe', 'icyllis.checkerframe'
    relocate 'com.github.benmanes.caffeine', 'icyllis.caffeine'
    relocate 'com.vladsch.flexmark', 'icyllis.flexmark'
    relocate 'org.intellij.lang.annotations', 'icyllis.annotations'
    relocate 'org.jetbrains.annotations', 'icyllis.annotations'
    relocate 'io.reactivex.rxjava3', 'icyllis.rxjava3'
    relocate 'org.reactivestreams', 'icyllis.reactivestreams'

    exclude 'META-INF/CHANGES'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/LICENSE**'
    exclude 'META-INF/NOTICE**'
    exclude 'META-INF/README**'
    exclude 'META-INF/maven/**'*/
}

/*remapJar {
    dependsOn(shadowJar)
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier.set("universal")
}

tasks.register('remapMavenJar', RemapJarTask) {
    dependsOn(jar)
    inputFile.set(jar.archiveFile)
    addNestedDependencies = false
    *//*targetNamespace.set("srg") // to srg names
    remapAccessWidener.set(true)*//*
    archiveClassifier.set("maven")
}*/

tasks.register('mavenJar', Jar) {
    dependsOn(jar)
    with(tasks.jar)
    archiveClassifier.set("maven")
}

if (project.hasProperty("keystore")) {
    shadowJar.doLast {
        ant.signjar(
                jar: shadowJar.archiveFile.get(),
                alias: project.getProperty("keystore_alias"),
                storepass: project.getProperty("keystore_pass"),
                keystore: project.getProperty("keystore"),
                storetype: 'pkcs12',
                keypass: project.getProperty("keystore_keypass"),
                tsaurl: 'http://timestamp.digicert.com'
        )
    }
}

processResources {
    inputs.property 'version', targetModVersion
    inputs.property 'edition', rootProject.ext.editionName

    filesMatching("META-INF/neoforge.mods.toml") {
        expand 'version': targetModVersion
    }

    // Appending the block keeps both targets on one metadata file.
    if (isLite) {
        doLast {
            def meta = file("${destinationDir}/META-INF/neoforge.mods.toml")
            meta.text = meta.text + '''
[[dependencies.modernui]]
    modId="yet-another-config-lib"
    type="required"
    versionRange="[3.9.7,)"
    ordering="NONE"
    side="CLIENT"
'''
        }
    }
}

jar {
    // exclude MC/Blaze3D compile-time stubs from the plain jar as well
    exclude 'net/minecraft/**'
    exclude 'com/mojang/**'
    manifest {
        attributes(
                "Specification-Title"     : project.name,
                "Specification-Vendor"    : "BloCamLimb",
                "Specification-Version"   : "2",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "BloCamLimb",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifact(mavenJar.archiveFile) {
                builtBy build
            }
            artifact(sourcesJar.archiveFile) {
                builtBy build
                classifier 'sources'
            }
            artifactId = project.name
            groupId = project.group
            version = project.version

            pom {
                artifactId = project.name
                groupId = project.group
                version = project.version
                name = rootProject.name
                packaging = 'pom'
                scm {
                    url = 'https://github.com/BloCamLimb/ModernUI-MC.git'
                }
                issueManagement {
                    system = 'github'
                    url = 'https://github.com/BloCamLimb/ModernUI/issues'
                }
                licenses {
                    license {
                        name = 'LGPL-3.0-or-later'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.en.html'
                        distribution = 'repo'
                    }
                }
                // do not provide any dependencies here, since this is a minecraft development
                /*withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')
                    configurations.library.allDependencies.each {
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', it.group)
                        dependencyNode.appendNode('artifactId', it.name)
                        dependencyNode.appendNode('version', it.version)
                        dependencyNode.appendNode('scope', 'compile')
                    }
                }*/
            }
        }
    }
}

// CurseForge upload: NeoForge, project "ModernUI Unofficial-Port" (ID 1698418)
// 注意：NeoForge 端没有任何前置依赖（只有 Fabric 端以 forge-config-api-port 为前置），故不写 relations。
curseforge {
    apiKey = project.findProperty('curseforge_api_key') ?: ''
    project {
        id = '1698418'
        changelogType = 'markdown'
        changelog = ''
        releaseType = project.findProperty('curse_release_type') ?: 'release'
        mainArtifact(tasks.named('shadowJar').get()) {
            displayName = "Modern UI ${targetModVersion} (NeoForge) for Minecraft ${targetMinecraft}"
        }
        addGameVersion targetMinecraft
        addGameVersion 'NeoForge'
        addGameVersion 'Client'
    }
    options {
        javaIntegration = false
        forgeGradleIntegration = false
    }
}
tasks.named('curseforge') { dependsOn 'shadowJar' }
