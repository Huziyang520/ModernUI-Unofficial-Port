plugins {
    id 'org.relativitymc.neo-loom'
}

loom {
    accessWidenerPath = file("src/main/resources/modernui.classtweaker")
}

rootProject.ext.applyTargetSources(project, 'common')

repositories {
    maven {
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        url 'https://maven.izzel.io/releases/'
    }
    maven {
        url 'https://maven.isxander.dev/releases'
        content {
            includeGroup 'dev.isxander'
        }
    }
    mavenLocal()
}

def tv = rootProject.ext.tv

dependencies {
    minecraft "com.mojang:minecraft:${tv('minecraft_version', minecraft_version)}"
    compileOnly 'org.spongepowered:mixin:0.8.7'
    compileOnly 'org.ow2.asm:asm-tree:9.8'

    implementation("dev.icyllis:modernui-core:${tv('core_version', core_version)}")
    implementation("icyllis.modernui:ModernUI-Markflow:3.12.0") {
        transitive = false
    }

    // Only the lite edition compiles against YetAnotherConfigLib; the regular build
    // never sees the class, so its jar cannot accidentally depend on it.
    if (rootProject.ext.isLite) {
        compileOnly "dev.isxander:yet-another-config-lib:${tv('yacl_version', '3.9.7+26.3-neoforge')}"
    }

    // Optional VulkanMod integration: compile-only, never bundled or required at runtime.
    compileOnly("maven.modrinth:JYQhtZtO:PNODQNIn")
    compileOnly("org.lwjgl:lwjgl-vulkan:3.4.1")
}

test {
    failOnNoDiscoveredTests = false
}
