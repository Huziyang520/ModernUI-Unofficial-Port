plugins {
    id 'maven-publish'
    id 'org.relativitymc.neo-loom' version '1.17.10' apply false
    id 'com.gradleup.shadow' version '9.3.0' apply false
}

// --- multi-version targets ---------------------------------------------------
// One shared source tree plus a per-target delta: -Ptarget=26.2 selects targets/26.2.
ext.targetName = (findProperty('target') ?: '26.3').toString()
ext.targetProps = new Properties()
def targetPropsFile = file("targets/${ext.targetName}/target.properties")
if (!targetPropsFile.exists()) {
    throw new GradleException("Unknown target '${ext.targetName}', missing ${targetPropsFile}")
}
targetPropsFile.withInputStream { ext.targetProps.load(it) }

ext.tv = { String key, String fallback -> ext.targetProps.getProperty(key) ?: fallback }

// --- editions ---------------------------------------------------------------
// 'full' is the regular build; 'lite' ships without the in-house settings UI and
// without the bundled font pack: -Pedition=lite. A lite run physically excludes the
// files it does not contain, it never builds them and hides them at runtime.
ext.editionName = (findProperty('edition') ?: 'full').toString()
def editionDir = file("editions/${ext.editionName}")
if (!editionDir.isDirectory()) {
    throw new GradleException("Unknown edition '${ext.editionName}', missing ${editionDir}")
}
ext.editionProps = new Properties()
def editionPropsFile = file("editions/${ext.editionName}/edition.properties")
if (editionPropsFile.exists()) {
    editionPropsFile.withInputStream { ext.editionProps.load(it) }
}

ext.ev = { String key, String fallback -> ext.editionProps.getProperty(key) ?: fallback }

ext.isLite = ext.editionName == 'lite'

// Merges the shared sources with the target overlay before compiling, so a class
// exists exactly once no matter how many files a target overrides. The edition
// overlay wins over the target overlay, which wins over the shared tree.
ext.applyTargetSources = { Project prj, String modulePath ->
    def root = rootProject
    def editionOverlay = root.file("editions/${root.ext.editionName}/${modulePath}/src/main")
    def overlay = root.file("targets/${root.ext.targetName}/${modulePath}/src/main")
    def deleted = []
    [root.file("targets/${root.ext.targetName}/deleted.txt"),
     root.file("editions/${root.ext.editionName}/deleted.txt")].each { f ->
        if (f.exists()) {
            deleted += f.readLines().findAll { it.trim() && !it.startsWith('#') }
                    .collect { it.trim() }
        }
    }
    def deletedFor = { String sub ->
        deleted.findAll { it.replace('\\', '/').startsWith("${modulePath}/${sub}/") }
                .collect { it.replace('\\', '/').substring("${modulePath}/${sub}/".length()) }
    }
    def javaEx = deletedFor('src/main/java')
    def resEx = deletedFor('src/main/resources')

    def mergedJava = prj.layout.buildDirectory.dir('targetSrc/java')
    def mergedRes = prj.layout.buildDirectory.dir('targetSrc/resources')
    // EXCLUDE keeps the first copy, so the overlays are listed before the shared tree.
    // The edition overlay is authored knowing what it replaces, so it is never pruned.
    def syncJava = prj.tasks.register('mergeTargetJava', Sync) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        if (new File(editionOverlay, 'java').isDirectory()) {
            from(new File(editionOverlay, 'java'))
        }
        if (new File(overlay, 'java').isDirectory()) {
            from(new File(overlay, 'java')) { exclude javaEx }
        }
        from(prj.file('src/main/java')) { exclude javaEx }
        into mergedJava
    }
    def syncRes = prj.tasks.register('mergeTargetResources', Sync) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        inputs.property 'edition', root.ext.editionName
        inputs.property 'target', root.ext.targetName
        if (new File(editionOverlay, 'resources').isDirectory()) {
            from(new File(editionOverlay, 'resources'))
        }
        if (new File(overlay, 'resources').isDirectory()) {
            from(new File(overlay, 'resources')) { exclude resEx }
        }
        from(prj.file('src/main/resources')) { exclude resEx }
        into mergedRes
        // Language files cannot be overlaid (one file per locale), so every locale is
        // composed from scratch: shared tree, then target overlay, then the edition.
        // Reading the previous output instead would leak keys across editions.
        doLast {
            def langPaths = ['assets/modernui/lang' as String]
            def sources = [
                    new File(prj.file('src/main/resources'), 'assets/modernui/lang'),
                    new File(overlay, 'resources/assets/modernui/lang'),
                    new File(editionOverlay, 'resources/assets/modernui/lang'),
                    root.file("editions/${root.ext.editionName}/lang"),
            ]
            def outDir = new File(mergedRes.get().asFile, 'assets/modernui/lang')
            if (!outDir.isDirectory()) {
                return
            }
            def slurper = new groovy.json.JsonSlurper()
            outDir.listFiles({ f -> f.name.endsWith('.json') } as FileFilter)?.each { out ->
                def merged = new LinkedHashMap<String, Object>()
                sources.each { dir ->
                    def src = new File(dir, out.name)
                    if (src.isFile()) {
                        merged.putAll(slurper.parseText(src.getText('UTF-8')) as Map<String, Object>)
                    }
                }
                out.write(groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(merged)), 'UTF-8')
            }
        }
    }
    prj.sourceSets.main.java.setSrcDirs([mergedJava.get().asFile])
    prj.sourceSets.main.resources.setSrcDirs([mergedRes.get().asFile])
    prj.tasks.withType(JavaCompile).configureEach { dependsOn syncJava, syncRes }
    prj.tasks.withType(ProcessResources).configureEach { dependsOn syncJava, syncRes }
    prj.tasks.withType(Javadoc).configureEach { dependsOn syncJava, syncRes }
    prj.tasks.withType(org.gradle.api.tasks.bundling.Jar).configureEach { dependsOn syncJava, syncRes }
    return [syncJava, syncRes]
}

publishing {
    repositories {
        maven {
            name 'IzzelAliz'
            url 'https://maven.izzel.io/releases'
            credentials {
                username = project.findProperty("izzel_maven_user")
                password = project.findProperty("izzel_maven_old_token")
            }
        }
    }
}

subprojects {
    apply plugin: 'java'

    group = 'icyllis.modernui'

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    repositories {
        mavenCentral()
        maven {
            url "https://central.sonatype.com/repository/maven-snapshots"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    dependencies {
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        compileOnly 'org.jetbrains:annotations:26.0.2'
        testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        testCompileOnly 'org.jetbrains:annotations:26.0.2'
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release.set(25)
    }

    java {
        withSourcesJar()
    }
}
